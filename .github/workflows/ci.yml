name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack npm artifact
        run: npm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: capture-windows-application-mcp
          path: |
            dist/**
            package.json
            package-lock.json
            plugin.json
            .mcp.json
            .claude-plugin/**
            .codex-plugin/**
            skills/**
            scripts/**
            README.md
            LICENSE
            *.tgz
