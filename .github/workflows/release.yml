name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create npm package
        run: npm pack

      - name: Create plugin archive
        shell: pwsh
        run: |
          $files = @(
            "dist",
            "skills",
            "scripts",
            ".claude-plugin",
            ".codex-plugin",
            ".mcp.json",
            "plugin.json",
            "package.json",
            "package-lock.json",
            "README.md",
            "LICENSE"
          )
          Compress-Archive -Path $files -DestinationPath "capture-windows-application-plugin.zip"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            capture-windows-application-plugin.zip
