name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Create npm package
        if: ${{ steps.release.outputs.release_created }}
        run: npm pack

      - name: Create plugin archive
        if: ${{ steps.release.outputs.release_created }}
        shell: pwsh
        run: |
          $files = @(
            "dist",
            "skills",
            "scripts",
            ".claude-plugin",
            ".codex-plugin",
            ".mcp.json",
            "plugin.json",
            "package.json",
            "package-lock.json",
            "README.md",
            "LICENSE"
          )
          Compress-Archive -Path $files -DestinationPath "capture-windows-application-plugin.zip"

      - name: Publish GitHub release assets
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            *.tgz
            capture-windows-application-plugin.zip
